schema_version: 1
phase: candidate_erm

phase0_dir: /home/ryreu/guided_cnn/logsWaterbird/setv_waterbirds95/phase0
fusion_dirs:
  exact: null
  sanitized: null
  set: null
output_root: /home/ryreu/guided_cnn/logsWaterbird/setv_waterbirds95/candidate_erm

model:
  architecture: vit_small_patch16_224
  pretrained: true
  num_classes: 2
  normalization_mean: [0.485, 0.456, 0.406]
  normalization_std: [0.229, 0.224, 0.225]

training:
  seed: null
  epochs: 50
  optimizer: AdamW
  learning_rate: 0.00003
  weight_decay: 0.05
