  pseudo_group_tie_break: [ordinary_accuracy, ordinary_loss, earlier_epoch]

storage:
  save_all_candidate_checkpoints: false
  save_rolling_selected_checkpoints: true
  deduplicate_checkpoints_by_epoch: true
  save_biased_val_logits_every_epoch: true
