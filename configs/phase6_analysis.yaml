schema_version: 1
phase: phase6_analysis

phase0_dir: /home/ryreu/guided_cnn/logsWaterbird/setv_waterbirds95/phase0
candidate_root: /home/ryreu/guided_cnn/logsWaterbird/setv_waterbirds95/candidate_erm
candidate_seeds: []
ula_proxy_dir: null
fusion_dirs:
  exact: null
  sanitized: null
  set: null
output_dir: /home/ryreu/guided_cnn/logsWaterbird/setv_waterbirds95/phase6

selection:
  score_tolerance: 0.00000001
  regret_tie_threshold: 0.005
  spearman_tie_threshold: 0.02
  minimum_candidate_seeds: 3
  choose_expert_and_fusion_jointly: true
  primary_criteria:
    - mean_oracle_selection_regret
    - worst_oracle_selection_regret
    - mean_spearman
    - mean_kendall
    - mean_pairwise_ranking_accuracy

# Secondary evidence is derived only from verified expert artifacts. A metric is
# skipped unless it exists and has the same meaning for every tied expert.
expert_metadata:
  derive_from_verified_artifacts: true
  leakage_metric: maximum_heldout_mask_balanced_accuracy
  stability_metric: mean_per_image_view_margin_std
  missing_metric_policy: skip_unless_comparable_for_all_tied_experts
  simplicity_rank:
    exact: 1
    sanitized: 2
    set: 3

# Operational definitions for the qualitative Section 22 kill criteria. These
# flags diagnose a run; they never authorize silent changes to the locked method.
kill_criteria:
  object_balanced_accuracy_near_chance_ceiling: 0.55
  background_margin_standard_deviation_floor: 0.001
  essentially_identical_epoch_tolerance: 1
  high_score_quantile: 0.90
  high_score_accuracy_tolerance: 0.0
  selector_regret_improvement_tolerance: 0.0

test_policy:
  reporting_only: true
  load_only_after_hashed_freeze: true
  print_before_freeze: false
