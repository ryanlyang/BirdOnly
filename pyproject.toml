[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setv-waterbirds95"
version = "0.1.0"
description = "Spatial Evidence-Tilted Validation on Waterbirds95"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=5.4",
]

[project.optional-dependencies]
training = [
  "torch>=2.4",
  "timm>=1.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
