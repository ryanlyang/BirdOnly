[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorcal-waterbirds100"
version = "0.5.0"
description = "AnchorCal controlled-reliance model-selection pilot on Waterbirds100"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=5.4",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "h5py>=3.8",
  "safetensors>=0.4",
  "huggingface_hub>=0.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
training = [
  "torch>=2.11",
  "torchvision>=0.26",
  "timm==1.0.28",
]
test = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["anchorcal*"]
